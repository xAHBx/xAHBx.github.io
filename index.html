<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xAHBx - Dopamine Repository</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo-placeholder">🔒</div>
            
            <a href="javascript:addToSileo()" class="title-link">
                <h1>xAHBx</h1>
            </a>
            <p class="subtitle">Dopamine Repository</p>
            
            <div class="divider"></div>
            
            <p class="developer">iabdullahhb</p>
            <p class="role">iOS Jailbreak Tweaks Developer</p>
            
            <div class="repo-section">
                <p class="label">Repository URL</p>
                <code>https://xahbx.github.io/</code>
                <p class="instruction">Open Sileo → Settings → Add Repository</p>
            </div>
            
            <div class="links">
                <a href="javascript:addToSileo()" class="link-btn primary">
                    <span class="icon">📦</span> Add to Sileo
                </a>
                <a href="https://t.me/iabdullahhb" class="link-btn secondary">
                    <span class="icon">✈️</span> Telegram
                </a>
            </div>
            
            <div class="divider"></div>
            
            <p class="footer-text">&copy; 2016–2026 xAHBx</p>
        </div>
    </div>

    <script>
        function addToSileo() {
            const repoURL = "https://xahbx.github.io/";
            const sileoDirect = "sileo://source/" + encodeURIComponent(repoURL);
            
            // محاولة فتح Sileo
            window.location.href = sileoDirect;
            
            // إذا لم تعمل بعد 1.5 ثانية، انسخ الرابط
            setTimeout(() => {
                alert("تم نسخ رابط الريبو:\n" + repoURL);
                navigator.clipboard.writeText(repoURL);
            }, 1500);
        }
    </script>
</body>
</html>
